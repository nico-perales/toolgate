[package]
name = "toolgate"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Security auditor for MCP servers: capability inventory, tool-poisoning signals, and rug-pull detection."
authors = ["nico-perales <289412610+nico-perales@users.noreply.github.com>"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/nico-perales/toolgate"
keywords = ["mcp", "security", "supply-chain", "ai-agents", "audit"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["/.github"]

[features]
default = ["cli"]
cli = ["dep:clap", "dep:anyhow"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
oxc_allocator = "0.75.0"
oxc_parser = "0.75.0"
oxc_ast = "0.75.0"
oxc_span = "0.75.0"
oxc_ast_visit = "0.75.0"

clap = { version = "4", features = ["derive"], optional = true }
anyhow = { version = "1", optional = true }

[lib]
name = "toolgate"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
