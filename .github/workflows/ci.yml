name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The launch and MCP tests skip themselves when Node is missing, so
      # without this check they would pass while testing nothing.
      - name: Node must be present
        run: node --version
      - name: Build
        run: cargo build --all-targets --locked
      - name: Test
        run: cargo test --locked
      - name: Build library without default features
        run: cargo build --lib --no-default-features --locked

  # The proxy in front of the official reference servers. A job of its own:
  # it needs the network and npm, and a failure there must not hide a failure
  # in the tests above.
  interop:
    name: Interop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Node must be present
        run: node --version
      # One at a time: parallel npx installs of the same package race in the
      # npm cache.
      - name: The proxy against the official reference servers
        run: cargo test --locked --test interop -- --ignored --test-threads=1


  lint:
    name: Format & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --all-targets --all-features --locked

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit
        run: cargo audit
